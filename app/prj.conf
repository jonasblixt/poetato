# Enable Zephyr Logging Framework
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=n   # Use deferred logging mode for minimal performance impact

# Enable SEGGER RTT Core
CONFIG_USE_SEGGER_RTT=y
CONFIG_SEGGER_RTT_CUSTOM_LOCKING=y

CONFIG_LOG_BACKEND_RTT=n
CONFIG_LOG_BACKEND_UART=n    # Disable UART logging to save pins/power (optional)
CONFIG_SHELL_LOG_BACKEND=y

# Buffer size adjustments (increase if logs get dropped under high throughput)
CONFIG_SEGGER_RTT_BUFFER_SIZE_UP=2048
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_RTT=y

# Enable Zephyr's code & data relocation subsystem
# CONFIG_CODE_DATA_RELOCATION=y

# Enable Cortex-M7 instruction cache (ensures rest of XIP Flash runs at peak speed)
#CONFIG_ICACHE=y
#CONFIG_DCACHE=y

# Copy the ARM vector table into RAM (VTOR points to RAM)
# CONFIG_SRAM_VECTOR_TABLE=y

#CONFIG_SRAM_BASE_ADDRESS=0x20000000

CONFIG_GPIO=y

# (Optional) Enable thread names and kernel commands in the shell
CONFIG_THREAD_NAME=y
CONFIG_KERNEL_SHELL=y
CONFIG_DEVICE_SHELL=y

# Disable External SDRAM (SEMC) Controller
CONFIG_MEMC=n
CONFIG_INIT_STACKS=y

# Enable network stack
CONFIG_NETWORKING=y
CONFIG_NET_LOG=y

# Enable IPv4
CONFIG_NET_IPV4=y

# Enable IPv6
CONFIG_NET_IPV6=y

# Enable TCP
CONFIG_NET_TCP=y

# Enable DHCP
CONFIG_NET_DHCPV4=y

# Enable the hardware random number generator driver
CONFIG_ENTROPY_GENERATOR=y
CONFIG_ENTROPY_STM32_RNG=y

# Tell mbedTLS and the socket layer to use this entropy source
CONFIG_TEST_RANDOM_GENERATOR=n

#endable DNS

CONFIG_DNS_RESOLVER=y
CONFIG_DNS_RESOLVER_MAX_SERVERS=2
CONFIG_DNS_NUM_CONCUR_QUERIES=1

# Enable Sockets (used by MQTT lib)
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y

# Enable MQTT
CONFIG_MQTT_LIB=y
CONFIG_MQTT_LIB_TLS=y

# Enable Mbed TLS
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_ENABLE_HEAP=y
CONFIG_MBEDTLS_HEAP_SIZE=60000
CONFIG_MBEDTLS_SSL_MAX_CONTENT_LEN=16384
CONFIG_MBEDTLS_PEM_PARSE_C=ya
CONFIG_MBEDTLS_PEM_WRITE_C=y
CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256=y

# Enable JSON
CONFIG_JSON_LIBRARY=y

# Enable net conn manager
CONFIG_NET_CONNECTION_MANAGER=y

# Enable device hostname
CONFIG_NET_HOSTNAME_ENABLE=y

# Enable Posix API functionality
CONFIG_POSIX_API=y

# Enable sensor API
CONFIG_SENSOR=y

# Enable LED API
CONFIG_LED=y

# Main stack size
CONFIG_MAIN_STACK_SIZE=8196

# System work queue stack size
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096

# Increase Rx net buffers
CONFIG_NET_BUF_RX_COUNT=100
