<text x="330" y="672" font-size="10.5" font-weight="700" fill="#22201D">Single-edge layout: what it costs</text>
<text x="330" y="690" font-size="10" fill="#6E6862">Every domain must reach the connector edge, so they are columns, not strips.</text>
<text x="330" y="705" font-size="10" fill="#6E6862">Barriers 1, 2 and 3 become U-shaped and total slot length roughly doubles.</text>
<text x="330" y="720" font-size="10" fill="#6E6862">The logic domain is the background; the other three are peninsulas rising from Y=0.</text>
<text x="330" y="735" font-size="10" fill="#6E6862">Only 72 mm of the 139 mm edge is used, so spacing between columns is generous.</text>
<text x="330" y="750" font-size="10" fill="#6E6862">LEDs must stay inside the dashed band - the outer 13.8 mm strips sit under the shelves.</text>
</svg>