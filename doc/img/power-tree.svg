<rect x="40" y="538" width="882" height="204" rx="8" fill="#FFFFFF" stroke="#D9D4CC"/>
<text x="58" y="558" font-size="12.5" font-weight="700" fill="#22201D">Power budget at the PD input</text>
<text x="58" y="582" font-size="11.5" fill="#6E6862">Logic: MCX N247 + KSZ8081 + SE051</text>
<text x="880" y="582" font-size="11.5" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" fill="#22201D" text-anchor="end">1.05 W</text>
<text x="58" y="602" font-size="11.5" fill="#6E6862">Digital inputs, 3 channels closed</text>
<text x="880" y="602" font-size="11.5" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" fill="#22201D" text-anchor="end">0.18 W</text>
<text x="58" y="622" font-size="11.5" fill="#6E6862">RS-485 field side via buck</text>
<text x="880" y="622" font-size="11.5" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" fill="#22201D" text-anchor="end">0.15 W</text>
<text x="58" y="642" font-size="11.5" fill="#6E6862">Field sensor supply allocation</text>
<text x="880" y="642" font-size="11.5" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" fill="#22201D" text-anchor="end">1.50 W</text>
<text x="58" y="662" font-size="11.5" fill="#6E6862">OptoMOS drive, 2 channels (from 3V3)</text>
<text x="880" y="662" font-size="11.5" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" fill="#22201D" text-anchor="end">0.05 W</text>
<text x="58" y="682" font-size="11.5" fill="#6E6862">Isolated converter losses (approx. 20%)</text>
<text x="880" y="682" font-size="11.5" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" fill="#22201D" text-anchor="end">0.50 W</text>
<text x="58" y="702" font-size="11.5" fill="#6E6862">PD flyback losses (approx. 15%)</text>
<text x="880" y="702" font-size="11.5" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" fill="#22201D" text-anchor="end">0.64 W</text>
<line x1="58" y1="708" x2="880" y2="708" stroke="#D9D4CC"/>
<text x="58" y="724" font-size="11.5" font-weight="700" fill="#22201D">Total drawn / available</text>
<text x="880" y="724" font-size="11.5" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-weight="700" fill="#22201D" text-anchor="end">4.07 W / 12.95 W</text>
